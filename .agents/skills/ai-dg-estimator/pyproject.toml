[project]
name = "ai-dg-estimator"
version = "0.3.1a0"
description = "AI-dg workspace-first drawing understanding, Ruby reconstruction, Excel deliverables and deterministic takeoff helpers"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
runtime = [
  "PyMuPDF>=1.24,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<12",
  "jsonschema>=4.23,<5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
