name: Build AI-dg Skill Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.agents/skills/ai-dg-estimator/**'
      - 'package_chatgpt.py'
      - 'CHATGPT_WORK.md'
      - '.github/workflows/build-skill-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate skill root
        run: |
          test -f .agents/skills/ai-dg-estimator/SKILL.md
          test -f .agents/skills/ai-dg-estimator/references/workspace-io.md
          test -f .agents/skills/ai-dg-estimator/references/project-deliverables.md
          test -f .agents/skills/ai-dg-estimator/scripts/workspace/init_project.py
          test -f .agents/skills/ai-dg-estimator/scripts/workspace/prepare_run.py
          test -f .agents/skills/ai-dg-estimator/scripts/workspace/scan_input.py
          test -f .agents/skills/ai-dg-estimator/scripts/workspace/export_project_excel.py
          test -f .agents/skills/ai-dg-estimator/scripts/workspace/finalize_output.py
          test -f .agents/skills/ai-dg-estimator/scripts/sketchup/vn1_prototype.rb
          python - <<'PY'
          from pathlib import Path
          text = Path('.agents/skills/ai-dg-estimator/SKILL.md').read_text(encoding='utf-8')
          assert text.startswith('---\n'), 'SKILL.md must start with YAML frontmatter'
          assert '\nname: ai-dg-estimator\n' in text, 'skill name missing'
          assert '\ndescription:' in text, 'skill description missing'
          assert 'version: "0.3.1-alpha"' in text, 'unexpected skill version'
          print('Basic SKILL.md validation passed')
          PY

      - name: Run dependency-light compatibility smoke test
        run: python .agents/skills/ai-dg-estimator/scripts/smoke_test.py

      - name: Install Excel test dependencies
        run: python -m pip install 'openpyxl>=3.1,<4' 'Pillow>=10,<12'

      - name: Smoke test fresh-run workspace and deliverables
        run: |
          python .agents/skills/ai-dg-estimator/scripts/workspace/init_project.py /tmp/ai-dg-demo --name "CI Demo"
          echo "source-current" > /tmp/ai-dg-demo/INPUT/OTHER/example.txt
          echo "stale-work" > /tmp/ai-dg-demo/WORK/extracted/stale.json
          echo "stale-ruby" > /tmp/ai-dg-demo/OUTPUT/RUBY/stale.rb
          echo "stale-excel" > /tmp/ai-dg-demo/OUTPUT/EXCEL/stale.xlsx

          python .agents/skills/ai-dg-estimator/scripts/workspace/prepare_run.py /tmp/ai-dg-demo

          test -f /tmp/ai-dg-demo/INPUT/OTHER/example.txt
          test -f /tmp/ai-dg-demo/project.ai-dg.json
          test -f /tmp/ai-dg-demo/WORK/logs/run-start.json
          test -f /tmp/ai-dg-demo/WORK/manifests/input-manifest.json
          test ! -e /tmp/ai-dg-demo/WORK/extracted/stale.json
          test ! -e /tmp/ai-dg-demo/OUTPUT/RUBY/stale.rb
          test ! -e /tmp/ai-dg-demo/OUTPUT/EXCEL/stale.xlsx

          cat > /tmp/ai-dg-demo/WORK/geometry/geometry-ledger.json <<'JSON'
          {"items":[{"item_code":"TEST-01","item_name":"Test item","component_geometry_readiness":"PARTIAL_READY","envelope":{"x_mm":1000,"y_mm":40,"z_mm":500}}]}
          JSON
          cat > /tmp/ai-dg-demo/OUTPUT/TAKEOFF/items.json <<'JSON'
          {"items":[{"id":"TEST-01","item_code":"TEST-01","item_name":"Test item","material_code":"MDF-TEST","length_mm":1000,"width_mm":500,"thickness_mm":18,"quantity":1,"confidence":1.0,"review_required":false,"source":{"pdf":"example.pdf","page":1,"evidence":"CI"}}]}
          JSON
          cat > /tmp/ai-dg-demo/OUTPUT/TAKEOFF/material-regions.json <<'JSON'
          {"material_regions":[{"item_code":"TEST-01","region":"body","material_code":"MDF-TEST","material_role":"PANEL","dimensions":{"x_mm":1000,"z_mm":500},"status":"PARTIAL_READY","source":{"file":"example.pdf","page":1}}]}
          JSON
          cat > /tmp/ai-dg-demo/OUTPUT/TAKEOFF/bom.json <<'JSON'
          {"bom":[{"material_code":"MDF-TEST","thickness_mm":18,"net_area_m2":0.5,"required_area_m2":0.5,"net_volume_m3":0.009,"sheet_length_mm":2440,"sheet_width_mm":1220,"theoretical_sheet_count":1,"item_ids":["TEST-01"]}],"review":[]}
          JSON
          echo '# Ruby test artifact' > /tmp/ai-dg-demo/OUTPUT/RUBY/TEST-01.rb

          python .agents/skills/ai-dg-estimator/scripts/workspace/export_project_excel.py /tmp/ai-dg-demo
          test -f /tmp/ai-dg-demo/OUTPUT/EXCEL/AI-dg_Tong-hop-vat-lieu.xlsx
          test -f /tmp/ai-dg-demo/OUTPUT/EXCEL/AI-dg_Bao-gia.xlsx

          echo "# CI output" > /tmp/ai-dg-demo/OUTPUT/REPORTS/analysis.md
          python .agents/skills/ai-dg-estimator/scripts/workspace/finalize_output.py /tmp/ai-dg-demo --status PASS
          test -f /tmp/ai-dg-demo/OUTPUT/output-manifest.json
          grep -q '"run_status": "PASS"' /tmp/ai-dg-demo/OUTPUT/output-manifest.json

      - name: Build ChatGPT Work upload package
        run: python package_chatgpt.py

      - name: Inspect ZIP root
        run: |
          unzip -l dist/AI-dg-Work-v0.3.1-alpha.zip
          unzip -p dist/AI-dg-Work-v0.3.1-alpha.zip SKILL.md | head -n 16
          cat dist/AI-dg-Work-v0.3.1-alpha.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-dg-Work-v0.3.1-alpha
          path: |
            dist/AI-dg-Work-v0.3.1-alpha.zip
            dist/AI-dg-Work-v0.3.1-alpha.sha256
            dist/AI-dg-Work-v0.3.1-alpha-contents.txt
            dist/ai-dg-estimator.zip
          if-no-files-found: error
