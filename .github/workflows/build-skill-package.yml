name: Build AI-dg Skill Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.agents/skills/ai-dg-estimator/**'
      - 'package_chatgpt.py'
      - 'CHATGPT_WORK.md'
      - '.github/workflows/build-skill-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate skill root
        run: |
          test -f .agents/skills/ai-dg-estimator/SKILL.md
          python - <<'PY'
          from pathlib import Path
          text = Path('.agents/skills/ai-dg-estimator/SKILL.md').read_text(encoding='utf-8')
          assert text.startswith('---\n'), 'SKILL.md must start with YAML frontmatter'
          assert '\nname: ai-dg-estimator\n' in text, 'skill name missing'
          assert '\ndescription:' in text, 'skill description missing'
          assert 'version: "0.2.2-alpha"' in text, 'unexpected skill version'
          print('Basic SKILL.md validation passed')
          PY

      - name: Run dependency-light compatibility smoke test
        run: python .agents/skills/ai-dg-estimator/scripts/smoke_test.py

      - name: Build ChatGPT Work upload package
        run: python package_chatgpt.py

      - name: Inspect ZIP root
        run: |
          unzip -l dist/AI-dg-Work-v0.2.2-alpha.zip
          unzip -p dist/AI-dg-Work-v0.2.2-alpha.zip SKILL.md | head -n 16
          cat dist/AI-dg-Work-v0.2.2-alpha.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-dg-Work-v0.2.2-alpha
          path: |
            dist/AI-dg-Work-v0.2.2-alpha.zip
            dist/AI-dg-Work-v0.2.2-alpha.sha256
            dist/AI-dg-Work-v0.2.2-alpha-contents.txt
            dist/ai-dg-estimator.zip
          if-no-files-found: error
